name: CI

on:
  push:
    branches:
      - master

  pull_request:

permissions:
  contents: read
  # Cache saves (actions/cache + sccache GHA backend) require `actions: write`.
  # Without it, saves are silently skipped and every run restores nothing.
  actions: write

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: mozilla-actions/sccache-action@v0.0.8

      # Per-job cache keys (no shared-key): each job's key includes its job id,
      # the rustc version, and the Cargo.lock hash, so jobs never fight over
      # saving the same key concurrently and lockfile changes only rebuild
      # changed dependencies.
      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --workspace --all-targets -- -D warnings

  feature-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.8

      - uses: Swatinem/rust-cache@v2

      - run: cargo check --workspace --all-features

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@nextest

      - uses: mozilla-actions/sccache-action@v0.0.8

      - uses: Swatinem/rust-cache@v2

      - run: cargo nextest run --workspace --all-features
